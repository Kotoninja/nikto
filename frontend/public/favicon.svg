<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- Chat bubble -->
  <rect x="30" y="0" width="140" height="10" fill="#00ff88"/>
  <rect x="10" y="10" width="180" height="10" fill="#00ff88"/>
  <rect x="0" y="20" width="200" height="110" fill="#00ff88"/>
  <rect x="0" y="130" width="200" height="20" fill="#00ff88"/>
  <rect x="10" y="150" width="180" height="10" fill="#00ff88"/>
  <!-- Tail -->
  <rect x="20" y="160" width="70" height="10" fill="#00ff88"/>
  <rect x="110" y="160" width="80" height="10" fill="#00ff88"/>
  <rect x="20" y="170" width="40" height="10" fill="#00ff88"/>
  <rect x="80" y="170" width="110" height="10" fill="#00ff88"/>
  <rect x="20" y="180" width="20" height="10" fill="#00ff88"/>
  <rect x="60" y="180" width="130" height="10" fill="#00ff88"/>
  <rect x="50" y="190" width="140" height="10" fill="#00ff88"/>

  <!-- Mask body -->
  <rect x="40" y="35" width="120" height="10" fill="#003d1f"/>
  <rect x="30" y="45" width="140" height="70" fill="#003d1f"/>
  <rect x="40" y="115" width="40" height="10" fill="#003d1f"/>
  <rect x="120" y="115" width="40" height="10" fill="#003d1f"/>
  <rect x="40" y="125" width="20" height="10" fill="#003d1f"/>
  <rect x="140" y="125" width="20" height="10" fill="#003d1f"/>

  <!-- Left eye -->
  <rect x="40" y="60" width="50" height="30" fill="#00ff88"/>
  <!-- Right eye -->
  <rect x="110" y="60" width="50" height="30" fill="#00ff88"/>

  <!-- Nose dot -->
  <rect x="95" y="85" width="10" height="10" fill="#006633"/>

  <!-- Highlight on mask -->
  <rect x="50" y="37" width="30" height="6" fill="#005c2e"/>
</svg>